# Shiplock config: docs-vs-code release checks, deterministic and
# agent-audited (semantic and ablation prompts included).
# Install: pip install shiplock. Docs: https://github.com/shehuphd/shiplock
# Consumer zero: shiplock checks itself with the same package every other
# repo consumes.

[docs]
public = ["README.md", "USAGE.md", "ARCHITECTURE.md", "CHANGELOG.md", "MANIFEST.md"]
changelog = "CHANGELOG.md"
readme = "README.md"

[style]
# The house banned-word list. shiplock ships none; each repo declares its own.
banned = [
  "travel", "matters", "serious", "intersection", "quietly", "exactly",
  "genuine", "genuinely", "consistently", "straightforward", "worth", "earn",
  "earns", "sits", "sat", "lands", "landed", "shapes", "actually", "land",
  "shifts", "gap", "gaps", "sharper", "cleanly", "real",
]
allow = []
source_globs = ["src/**/*.py", "src/shiplock/prompts/*.md", "scripts/*.py"]

[version]
package = "shiplock"

[architecture]
doc = "ARCHITECTURE.md"
source_dir = "src/shiplock"
exempt = ["__init__"]

[manifest]
doc = "MANIFEST.md"
sources = ["src/**/*.py", "src/shiplock/prompts/*.md", "tests/**/*.py", "scripts/*.py"]
exempt = []

[[coverage]]
object = "shiplock"
doc = "USAGE.md"
kind = "exports"
exempt = ["__version__"]

[deps]
# Shiplock keeps no requirements files; the globs stand ready to catch one
# appearing with duplicates of pyproject's declarations.
requirements = ["requirements*.txt", "tools/requirements*.txt"]

[tests]
globs = ["tests/**/*.py"]

[anchors]
# Every flag, env var, and config key a public doc names must exist in the
# code, and a stated flag default must match the parser's. Tokens another
# tool owns are exempt.
exempt = ["--dangerously-bypass-approvals-and-sandbox"]

[judge]
# The model-judged layer (shiplock judge): doc coverage warnings and claim
# leads for the audit. Billable; runs only when invoked.
undocumented = []

[scan]
# Scan the git-tracked set. Private rules (internal-reference patterns, code-
# names, identities) live in the gitignored shiplock.local.toml, read by
# default; in CI the gate reads them from a repository secret. The tests plant
# leaks on purpose.
exclude = ["tests/**"]

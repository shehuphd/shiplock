name: release gate

# Shiplock as consumer zero: it runs its own reusable gate over itself.
# Started workflow_dispatch-only; the push and pull-request triggers went live
# after the first manual run passed green (2026-09-01).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ceiling for the reusable workflow's jobs: it needs to read the repo and open
# an issue on an audit failure.
permissions:
  contents: read
  issues: write

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      shiplock-spec: "."   # install shiplock from this repo, not PyPI
      # The deterministic checks run free on every push and PR; the billable
      # semantic audit runs only on manual dispatch (the pre-release run).
      run-audit: ${{ github.event_name == 'workflow_dispatch' }}
      audit-model: "claude-sonnet-5"
      audit-fallback-model: "gpt-5.3-codex"
    secrets:
      # Both stored in the provider/key format the gate expects,
      # e.g. anthropic/sk-ant-... and openai/sk-...
      AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
      AUDIT_FALLBACK_API_KEY: ${{ secrets.AUDIT_FALLBACK_API_KEY }}

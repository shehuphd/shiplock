name: release gate

# Shiplock as consumer zero: it runs its own reusable gate over itself.
# Started workflow_dispatch-only; the push and pull-request triggers went live
# after the first manual run passed green (2026-09-01).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ceiling for the reusable workflow's jobs: it needs to read the repo and open
# an issue on an audit failure.
permissions:
  contents: read
  issues: write

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      shiplock-spec: "."   # install shiplock from this repo, not PyPI
      run-audit: true
      # Routine pushes audit on the cheap model; a manual dispatch (the
      # pre-release run) uses the stronger one.
      audit-model: ${{ github.event_name == 'workflow_dispatch' && 'sonnet' || 'haiku' }}
    secrets:
      # The gate reads the provider from the "provider/key" prefix. The stored
      # secret is the bare key, so the prefix is composed here.
      AUDIT_API_KEY: anthropic/${{ secrets.ANTHROPIC_API_KEY }}

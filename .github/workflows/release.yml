name: release

# Publishes to PyPI via trusted publishing (OIDC) when a GitHub Release is
# published. The job targets the `release` environment, whose required-reviewer
# rule holds the upload until it's approved in the GitHub UI.

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

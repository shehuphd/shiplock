name: shiplock gate

# Reusable release gate, consumed by any repo via:
#
#   jobs:
#     gate:
#       uses: shehuphd/shiplock/.github/workflows/gate.yml@main
#       with:
#         shiplock-spec: "shiplock"   # "." for shiplock's own repo
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Layer 1 (check) runs the deterministic checks. Layer 2 (audit) runs the
# semantic audit through Claude Code and opens an issue on failure.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version the checks run on"
        type: string
        default: "3.12"
      shiplock-spec:
        description: "pip requirement for shiplock itself (use '.' in shiplock's own repo)"
        type: string
        default: "shiplock"
      run-audit:
        description: "Run the Layer 2 semantic audit"
        type: boolean
        default: true
      audit-model:
        description: "Model for the semantic audit (alias or id; alias survives id churn)"
        type: string
        default: "sonnet"
      audit-permission-mode:
        description: "Claude Code permission mode for the read-only audit run"
        type: string
        default: "dontAsk"
    secrets:
      ANTHROPIC_API_KEY:
        description: "API key for the Layer 2 audit; required only when run-audit is true"
        required: false
      ANTHROPIC_API_KEY_FALLBACK:
        description: >-
          Optional second API key from a DIFFERENT billing account or org. If
          the audit's first attempt fails (a dead key, an exhausted credit
          balance), the run resumes the same session under this key instead of
          restarting. A key from the same org shares the same credit balance
          and can't rescue an exhaustion.
        required: false

# Least privilege: no scopes at the top level; each job names what it needs.
permissions: {}

jobs:
  check:
    name: Deterministic checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed for the versioned-files check to diff against the
          # last reachable tag.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install shiplock and the repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ inputs.shiplock-spec }}"
          # The repo itself must be importable for the version and coverage checks.
          python -m pip install .
      - name: Run shiplock check
        run: shiplock check

  audit:
    name: Semantic audit
    needs: check
    if: ${{ inputs.run-audit }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install shiplock
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ inputs.shiplock-spec }}"
          python -m pip install .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the semantic audit
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FALLBACK_KEY: ${{ secrets.ANTHROPIC_API_KEY_FALLBACK }}
        run: |
          set -euo pipefail
          shiplock prompt > audit-prompt.md
          # Headless run: read-only tools only, no interactive prompt. JSON
          # output carries the result text plus the run's token usage. The
          # session id is pinned so an interrupted run can be resumed.
          SID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          rc=0
          claude -p "$(cat audit-prompt.md)" \
            --session-id "$SID" \
            --model "${{ inputs.audit-model }}" \
            --allowedTools "Read,Grep,Glob" \
            --permission-mode "${{ inputs.audit-permission-mode }}" \
            --output-format json > audit.json || rc=$?
          if [ "$rc" -ne 0 ] && [ -n "${FALLBACK_KEY:-}" ]; then
            # Resume the same session under the fallback key (a different
            # billing account), so the finished portion of the audit isn't
            # redone. The transcript lives on this runner's disk.
            echo "first attempt exited $rc; resuming session under the fallback key" >&2
            mv audit.json audit-first.json 2>/dev/null || true
            rc=0
            ANTHROPIC_API_KEY="$FALLBACK_KEY" claude -p \
              --resume "$SID" \
              "The previous run of this audit stopped mid-way on an API failure. Continue from where the transcript ends: keep the answers already settled, verify anything left half-done, work through the remaining questions, and end your output with the verdict line the original instructions require." \
              --model "${{ inputs.audit-model }}" \
              --allowedTools "Read,Grep,Glob" \
              --permission-mode "${{ inputs.audit-permission-mode }}" \
              --output-format json > audit.json || rc=$?
          fi
          exit "$rc"
      - name: Act on the verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ ! -s audit.json ]; then
            echo "::error::the audit produced no output" >&2
            exit 1
          fi

          # Usage report first, and fail-soft: a missing field prints n/a and
          # can never block the verdict. The cost figure is the CLI's own
          # estimate; a tokens-to-USD conversion via the rates package is a
          # planned follow-up.
          usage_row() { jq -r "$2 // \"n/a\"" "$1" 2>/dev/null || echo "n/a"; }
          table_row() {
            echo "| $2 | $(usage_row "$1" '.usage.input_tokens') | $(usage_row "$1" '.usage.output_tokens') | $(usage_row "$1" '.usage.cache_read_input_tokens') | $(usage_row "$1" '.usage.cache_creation_input_tokens') | $(usage_row "$1" '.total_cost_usd') |"
          }
          {
            echo "### Semantic audit usage"
            echo ""
            echo "| Attempt | Input | Output | Cache read | Cache write | Cost (CLI estimate, USD) |"
            echo "|---|---|---|---|---|---|"
            if [ -s audit-first.json ]; then
              table_row audit-first.json "1 (interrupted)"
              table_row audit.json "2 (resumed, fallback key)"
            else
              table_row audit.json "1"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          in_tok="$(usage_row audit.json '.usage.input_tokens')"
          out_tok="$(usage_row audit.json '.usage.output_tokens')"
          cache_r="$(usage_row audit.json '.usage.cache_read_input_tokens')"
          cache_w="$(usage_row audit.json '.usage.cache_creation_input_tokens')"
          cost="$(usage_row audit.json '.total_cost_usd')"
          usage_line="Audit usage: $in_tok in / $out_tok out (cache: $cache_r read, $cache_w written); CLI cost estimate: $cost USD."
          if [ -s audit-first.json ]; then
            usage_line="$usage_line Resumed under the fallback key after an interrupted first attempt; both attempts are in the job summary."
          fi

          jq -r '.result // empty' audit.json > audit-output.txt 2>/dev/null || true
          if [ ! -s audit-output.txt ]; then
            echo "::error::the audit result carried no text" >&2
            exit 1
          fi
          verdict="$(grep -E '^AUDIT: (PASS|FAIL)' audit-output.txt | tail -1 || true)"
          if echo "$verdict" | grep -q 'AUDIT: FAIL'; then
            printf '\n\n---\n%s\n' "$usage_line" >> audit-output.txt
            gh issue create \
              --title "Shiplock audit failed on ${GITHUB_SHA::7}" \
              --body-file audit-output.txt
            echo "::error::semantic audit failed; opened an issue" >&2
            exit 1
          elif echo "$verdict" | grep -q 'AUDIT: PASS'; then
            echo "semantic audit passed — $usage_line"
          else
            # No verdict line is not a pass. Fail closed.
            echo "::error::no AUDIT verdict line found in the audit output" >&2
            exit 1
          fi

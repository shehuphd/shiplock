name: shiplock gate

# Reusable release gate, consumed by any repo via:
#
#   jobs:
#     gate:
#       uses: shehuphd/shiplock/.github/workflows/gate.yml@main
#       with:
#         shiplock-spec: "shiplock"   # "." for shiplock's own repo
#         audit-model: "sonnet"       # in your provider's own naming
#       secrets:
#         AUDIT_API_KEY: ${{ secrets.YOUR_AUDIT_KEY }}
#
# Layer 1 (check) runs the deterministic checks. Layer 2 (audit) runs the
# semantic audit and opens an issue on failure.
#
# Both audit secrets are provider-prefixed strings: "provider/key", e.g.
# "anthropic/sk-ant-..." or "openai/sk-...". The gate reads the provider from
# the prefix (case-insensitive) and hands the key (case-sensitive, everything
# after the first slash) to that provider's agent CLI. Supporting a new
# provider is a code change here; the shape of the secrets never moves.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version the checks run on"
        type: string
        default: "3.12"
      shiplock-spec:
        description: "pip requirement for shiplock itself (use '.' in shiplock's own repo)"
        type: string
        default: "shiplock"
      run-audit:
        description: "Run the Layer 2 semantic audit"
        type: boolean
        default: true
      audit-model:
        description: >-
          Model for the audit run, in the key's provider's own naming. Required
          when run-audit is true: the provider comes from AUDIT_API_KEY, and
          model names don't carry across providers, so the gate never defaults
          this. Pick it from the key's own catalog ('keycall verify
          --provider <p> --source env:VAR' lists what the key can reach)
          rather than from memory; the gate refuses a name from another
          provider's naming at configuration time.
        type: string
        default: ""
      audit-fallback-model:
        description: >-
          Model for the fallback attempt, in the fallback key's provider's
          naming. Empty reuses audit-model when both keys name the same
          provider; a cross-provider fallback must declare its own.
        type: string
        default: ""
      audit-permission-mode:
        description: "Claude Code permission mode for the audit run (anthropic keys only)"
        type: string
        default: "dontAsk"
      audit-effort:
        description: >-
          Reasoning effort for the audit run: low, medium, high, xhigh, or
          max. Defaults to high. An anthropic key maps it to Claude Code's
          --effort; a google key maps it to Gemini's thinkingLevel (low,
          medium, high, with xhigh and max clamped to high; medium is
          gemini-3.1-pro only, and Gemini 3 already defaults to high). An
          openai key maps it to codex's model_reasoning_effort override. Lower it to cut
          cost when a blocked release is all you need from a failed audit;
          raise it if audits miss drift your repo's own review would have
          caught. Effort trades cost for how much the model reasons before it
          answers.
        type: string
        default: "high"
    secrets:
      AUDIT_API_KEY:
        description: >-
          The audit key as "provider/key" (e.g. anthropic/sk-ant-... or
          openai/sk-...). When unset, the audit job is skipped with a warning
          and only the deterministic checks gate the run.
        required: false
      AUDIT_FALLBACK_API_KEY:
        description: >-
          The key for the retry when the first attempt dies mid-run, as
          "provider/key". Empty disables failover. Put it on a different
          provider or billing account than the primary — credit exhaustion is
          account-level, so a sibling key from the same account is just as
          empty.
        required: false

# Least privilege: no scopes at the top level; each job names what it needs.
permissions: {}

jobs:
  check:
    name: Deterministic checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed for the versioned-files check to diff against the
          # last reachable tag.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install shiplock and the repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ inputs.shiplock-spec }}"
          # Only the version and coverage checks import the repo's package.
          # Ask shiplock whether this repo's config configures either before
          # installing it, so an app repo (no installable package) that
          # declares neither isn't forced to be pip-installable just to run
          # the checks that do apply to it.
          if [ "$(shiplock needs-import)" = "true" ]; then
            python -m pip install .
          fi
      - name: Run shiplock check
        run: shiplock check

  audit:
    name: Semantic audit
    needs: check
    if: ${{ inputs.run-audit }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install shiplock
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ inputs.shiplock-spec }}"
          # Same install gate as the check job: only version and coverage
          # import the repo's package, so an app repo that configures neither
          # isn't forced to be pip-installable for the audit either.
          if [ "$(shiplock needs-import)" = "true" ]; then
            python -m pip install .
          fi
          # rates prices each attempt's tokens from its own bundled snapshot
          # (offline; no network call), so the cost column works the same way
          # for every provider instead of relying on a CLI's self-reported
          # estimate that only some runners provide. keycall verifies each
          # audit key against its live provider before an attempt is spent.
          python -m pip install rates keycall
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Read the key providers and install their runners
        id: runners
        env:
          PRIMARY_KEY: ${{ secrets.AUDIT_API_KEY }}
          FALLBACK_KEY: ${{ secrets.AUDIT_FALLBACK_API_KEY }}
        run: |
          set -euo pipefail
          # Adapter registry: one line per provider the gate can run, as
          # "provider|cli|npm-install-spec|model-name-families". The provider
          # is the prefix on a provider/key secret; the cli is its agent
          # binary; the spec installs that binary; the families are the glob
          # shapes of that provider's model names, used to refuse a model
          # named in one provider's naming against another provider's key.
          # This table is the only place the provider set lives: the provider
          # list in error messages, the runner lookup, the installer, and the
          # family check all read it, so nothing downstream names a vendor or
          # assumes how many there are. Adding a provider is one line here plus
          # its invocation block in the audit step's run_attempt.
          ADAPTERS='anthropic|claude|@anthropic-ai/claude-code|claude*,sonnet*,opus*,haiku*
          openai|codex|@openai/codex|gpt*,o[0-9]*,codex*,chatgpt*
          google|gemini|@google/gemini-cli|gemini*'
          field() {  # $1 provider, $2 column → prints the cell; nonzero if unknown
            printf '%s\n' "$ADAPTERS" | awk -F'|' -v p="$1" -v c="$2" \
              '$1 == p { print $c; hit = 1 } END { exit !hit }'
          }
          known_providers() {  # the registry's provider column, comma-joined
            printf '%s\n' "$ADAPTERS" \
              | awk -F'|' 'NF { n++; s = s (n > 1 ? ", " : "") $1 } END { print s }'
          }
          # "provider/key" → provider is the text before the first slash,
          # lowercased; the key after it is left untouched (case-sensitive).
          provider_of() {
            case "$1" in
              */*) printf '%s' "${1%%/*}" | tr '[:upper:]' '[:lower:]' ;;
              *)   printf '' ;;
            esac
          }
          runner_of()   { field "$1" 2; }  # provider → the agent CLI
          npm_spec_of() { field "$1" 3; }  # provider → its npm install spec
          # Model names are per provider, and the audit's provider comes from
          # the key, so a model in one provider's naming against another
          # provider's key can never run; without this check it surfaces as a
          # run-time 404, retried five times, after an attempt was spent.
          require_family() {  # $1 input name, $2 model, $3 the key's provider
            while IFS='|' read -r prov _cli _npm fams; do
              [ -n "$prov" ] || continue
              [ "$prov" = "$3" ] && continue
              IFS=',' read -ra pats <<<"$fams"
              for pat in "${pats[@]}"; do
                case "$2" in
                  $pat)
                    echo "::error::$1 '$2' is $prov naming, but the key it runs under is $3; name a model from the $3 catalog: 'keycall verify --provider $3' lists what the key can reach" >&2
                    exit 1;;
                esac
              done
            done <<< "$ADAPTERS"
          }
          require() {  # $1 secret name, $2 secret value → prints provider
            provider="$(provider_of "$2")"
            if [ -z "$provider" ]; then
              echo "::error::$1 must be 'provider/key', e.g. anthropic/sk-ant-... or openai/sk-..." >&2
              exit 1
            fi
            if ! runner_of "$provider" >/dev/null; then
              echo "::error::$1 names provider '$provider'; the gate has adapters for: $(known_providers)" >&2
              exit 1
            fi
            echo "$provider"
          }
          install_provider() { npm install -g "$(npm_spec_of "$1")"; }
          if [ -z "${PRIMARY_KEY:-}" ]; then
            # No key is a skip, not a failure: the deterministic checks still
            # gate the run, and the warning keeps the skip visible.
            echo "::warning::no AUDIT_API_KEY secret is set, so the semantic audit was skipped; the deterministic checks still gate this run" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ inputs.audit-model }}" ]; then
            echo "::error::declare audit-model in your key's provider's own model naming; the gate can't default it because the provider comes from AUDIT_API_KEY" >&2
            exit 1
          fi
          primary_provider="$(require AUDIT_API_KEY "$PRIMARY_KEY")"
          require_family audit-model "${{ inputs.audit-model }}" "$primary_provider"
          primary_runner="$(runner_of "$primary_provider")"
          install_provider "$primary_provider"
          fallback_provider=""
          fallback_runner=""
          if [ -n "${FALLBACK_KEY:-}" ]; then
            fallback_provider="$(require AUDIT_FALLBACK_API_KEY "$FALLBACK_KEY")"
            fallback_runner="$(runner_of "$fallback_provider")"
            if [ "$fallback_provider" != "$primary_provider" ]; then
              install_provider "$fallback_provider"
              # A cross-provider fallback can't inherit the primary's model
              # name: model naming is per provider. Fail here, not mid-failover.
              if [ -z "${{ inputs.audit-fallback-model }}" ]; then
                echo "::error::the fallback key's provider ($fallback_provider) differs from the primary's ($primary_provider), so audit-fallback-model must name a model in $fallback_provider's own naming" >&2
                exit 1
              fi
            fi
            if [ -n "${{ inputs.audit-fallback-model }}" ]; then
              require_family audit-fallback-model "${{ inputs.audit-fallback-model }}" "$fallback_provider"
            fi
          fi
          # A dead key spends a full audit attempt to announce itself, so
          # each key is verified against its live provider first. keycall's
          # own output never carries the key. When keycall is not on PATH
          # (an offline run of this step), the check is skipped with a
          # warning rather than failed.
          preflight() {  # $1 secret name, $2 provider, $3 the bare key
            if ! command -v keycall >/dev/null 2>&1; then
              echo "::warning::keycall is not installed, so $1 was not verified up front; a dead key will only surface by spending an audit attempt" >&2
              return 0
            fi
            if ! KEYCALL_PREFLIGHT_KEY="$3" keycall verify --provider "$2" --source env:KEYCALL_PREFLIGHT_KEY; then
              echo "::error::$1 failed live verification against $2 (keycall's line above says why); fix the key rather than spending an audit attempt on it" >&2
              exit 1
            fi
          }
          preflight AUDIT_API_KEY "$primary_provider" "${PRIMARY_KEY#*/}"
          if [ -n "${FALLBACK_KEY:-}" ]; then
            preflight AUDIT_FALLBACK_API_KEY "${fallback_provider:-$primary_provider}" "${FALLBACK_KEY#*/}"
          fi
          {
            echo "primary-provider=$primary_provider"
            echo "primary-runner=$primary_runner"
            echo "fallback-provider=$fallback_provider"
            echo "fallback-runner=$fallback_runner"
          } >> "$GITHUB_OUTPUT"
      - name: Run the semantic audit
        id: audit
        if: ${{ steps.runners.outputs.skip != 'true' }}
        env:
          PRIMARY_KEY: ${{ secrets.AUDIT_API_KEY }}
          FALLBACK_KEY: ${{ secrets.AUDIT_FALLBACK_API_KEY }}
        run: |
          set -euo pipefail
          shiplock prompt > audit-prompt.md
          # The key is everything after the first slash of the secret. GitHub
          # masks the whole secret; mask the bare key too so a stray echo can
          # never print it. Masking must run at the top level — inside a
          # command substitution the ::add-mask:: line would be captured
          # instead of reaching the log processor.
          key_of() { printf '%s' "${1#*/}"; }
          echo "::add-mask::$(key_of "$PRIMARY_KEY")"
          if [ -n "${FALLBACK_KEY:-}" ]; then
            echo "::add-mask::$(key_of "$FALLBACK_KEY")"
          fi
          # One adapter per runner, each given only the tools the audit needs:
          # read and grep, plus a scoped progress-log write for Claude and a
          # sandbox bypass for Codex. JSON-ish output captured to the named
          # file, the runner's own key variable set from the neutral secret. The prompt's progress log (audit-progress.md) is
          # the state a second attempt continues from — it works across
          # providers, unlike any one provider's session store.
          run_attempt() {  # $1 runner, $2 model, $3 key, $4 prompt-file, $5 out-file
            SID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
            case "$1" in
              claude)
                # Empty audit-effort leaves the CLI's own default (currently
                # high) in place; a set value overrides it explicitly.
                # Deliberately unquoted below so it word-splits into two args
                # when set and vanishes when empty — a bash array would do
                # the same, but empty-array expansion under set -u only
                # became safe in bash 4.4+, and effort is always one of five
                # fixed words with no spaces, so word-splitting is safe here.
                effort_flag=""
                if [ -n "${{ inputs.audit-effort }}" ]; then
                  effort_flag="--effort ${{ inputs.audit-effort }}"
                fi
                ANTHROPIC_API_KEY="$3" claude -p "$(cat "$4")" \
                  --session-id "$SID" \
                  --model "$2" \
                  --allowedTools "Read,Grep,Glob,Write(audit-progress.md)" \
                  --permission-mode "${{ inputs.audit-permission-mode }}" \
                  $effort_flag \
                  --output-format json > "$5"
                ;;
              codex)
                # codex's own sandbox (bubblewrap on Linux) can't set up its
                # network namespace inside GitHub Actions' own containerized
                # runner ("bwrap: loopback: Failed RTM_NEWADDR: Operation not
                # permitted") — a nested-sandbox conflict, confirmed live. The
                # runner is itself an ephemeral, single-use, externally
                # sandboxed VM, which is exactly the case codex's own flag
                # help text names as the intended use of this bypass. --json
                # streams events whose turn.completed line carries token
                # usage; the final message goes to its own file.
                # audit-effort maps to codex's model_reasoning_effort config
                # override; empty leaves codex's own default. codex parses a -c
                # value as JSON and falls back to a bare string, so a level it
                # doesn't recognize reaches it as a string to resolve rather
                # than failing the parse.
                effort_conf=""
                if [ -n "${{ inputs.audit-effort }}" ]; then
                  effort_conf="-c model_reasoning_effort=${{ inputs.audit-effort }}"
                fi
                # Capture codex's own exit so a failure fails over instead of
                # being masked by the mapper below, which always exits clean
                # (the gemini branch captures its rc the same way).
                codex_rc=0
                CODEX_API_KEY="$3" OPENAI_API_KEY="$3" codex exec \
                  --model "$2" \
                  $effort_conf \
                  --dangerously-bypass-approvals-and-sandbox \
                  --json \
                  --output-last-message "$5.txt" \
                  - < "$4" > "$5.events" || codex_rc=$?
                python3 -c '
          import json, sys, pathlib
          base = sys.argv[1]
          txt = pathlib.Path(base + ".txt")
          result = txt.read_text() if txt.exists() else ""
          events = pathlib.Path(base + ".events")
          lines = events.read_text().splitlines() if events.exists() else []
          usage = {}
          for line in lines:
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get("type") == "turn.completed":
                  usage = event.get("usage") or {}
          mapped = {
              "input_tokens": usage.get("input_tokens"),
              "output_tokens": usage.get("output_tokens"),
              "cache_read_input_tokens": usage.get("cached_input_tokens"),
          }
          envelope = {"result": result,
                      "usage": {k: v for k, v in mapped.items() if v is not None}}
          print(json.dumps(envelope))' "$5" > "$5"
                return "$codex_rc"
                ;;
              gemini)
                # Gemini CLI's built-in toolset includes shell and file writes,
                # so a read-only run needs the tools.core allowlist, which drops
                # every built-in not named (there is no CLI flag for it, and
                # --allowed-tools only bypasses the confirmation dialog). A
                # workspace .gemini/settings.json takes precedence over the
                # checked-out repo's own, so the audit can't be widened by the
                # repo it inspects. GEMINI_CLI_TRUST_WORKSPACE=true is required
                # in an untrusted checkout: without it Gemini treats the folder
                # as untrusted, overrides the approval mode back to a prompt it
                # can't answer headless, and exits before any API call.
                # --approval-mode yolo then clears the headless approval prompt;
                # with shell and write absent there is nothing else it could
                # approve. Gemini can't scope a write to one path the way
                # claude's Write(audit-progress.md) does, so it gets no write
                # tool at all: a gemini primary that dies restarts on the
                # fallback rather than continuing from a log it couldn't write.
                # Build the workspace settings: the read-only tool allowlist
                # always, plus a per-model thinking-level override when
                # audit-effort is set (Gemini's analog of Claude's --effort).
                # Gemini 3 defaults to high, so an empty effort leaves it there.
                mkdir -p .gemini
                python3 - "$2" "${{ inputs.audit-effort }}" > .gemini/settings.json <<'PY'
          import json, sys
          model, effort = sys.argv[1], sys.argv[2].strip().lower()
          settings = {"tools": {"core": [
              "read_file", "read_many_files", "list_directory", "glob", "grep_search"]}}
          level = {"low": "low", "medium": "medium", "high": "high",
                   "xhigh": "high", "max": "high"}.get(effort)
          if level:
              settings["modelConfigs"] = {"overrides": [{
                  "match": {"model": model},
                  "modelConfig": {"generateContentConfig": {
                      "thinkingConfig": {"thinkingLevel": level}}}}]}
          print(json.dumps(settings))
          PY
                # --output-format json returns one object: response plus a stats
                # block whose per-model token counts price the run. prompt is
                # input, candidates + thoughts is output (reasoning included),
                # cached is cache-read; Gemini reports no cache-write.
                # Capture Gemini's own exit so a failure fails over instead of
                # being masked by the mapper below, which always exits clean.
                gemini_rc=0
                GEMINI_CLI_TRUST_WORKSPACE=true GEMINI_API_KEY="$3" gemini \
                  --model "$2" \
                  --approval-mode yolo \
                  --output-format json \
                  -p "$(cat "$4")" > "$5.raw" || gemini_rc=$?
                python3 -c '
          import json, sys, pathlib
          raw = pathlib.Path(sys.argv[1] + ".raw").read_text()
          data = json.loads(raw) if raw.strip() else {}
          totals = {"prompt": 0, "candidates": 0, "cached": 0, "thoughts": 0}
          for model in ((data.get("stats") or {}).get("models") or {}).values():
              tokens = model.get("tokens") or {}
              for key in totals:
                  totals[key] += tokens.get(key) or 0
          output = totals["candidates"] + totals["thoughts"]
          mapped = {
              "input_tokens": totals["prompt"] or None,
              "output_tokens": output or None,
              "cache_read_input_tokens": totals["cached"] or None,
          }
          envelope = {"result": data.get("response", ""),
                      "usage": {k: v for k, v in mapped.items() if v is not None}}
          print(json.dumps(envelope))' "$5" > "$5"
                return "$gemini_rc"
                ;;
              *) echo "::error::unknown audit runner '$1'" >&2; return 64 ;;
            esac
          }
          rc=0
          run_attempt "${{ steps.runners.outputs.primary-runner }}" "${{ inputs.audit-model }}" \
            "$(key_of "$PRIMARY_KEY")" audit-prompt.md audit.json || rc=$?
          if [ "$rc" -ne 0 ] && [ -n "${{ steps.runners.outputs.fallback-runner }}" ]; then
            echo "first attempt (${{ steps.runners.outputs.primary-provider }}) exited $rc; continuing on ${{ steps.runners.outputs.fallback-provider }}" >&2
            # Preserve attempt 1's whole output bundle before attempt 2
            # overwrites the audit.json* names: the envelope and whatever
            # intermediates its provider wrote (codex's .events/.txt, gemini's
            # .raw). A first attempt that died before writing anything still
            # leaves an empty audit-first.json marker, so the usage table shows
            # both attempts.
            for suffix in "" .events .txt .raw; do
              [ -e "audit.json$suffix" ] && mv "audit.json$suffix" "audit-first.json$suffix"
            done
            [ -e audit-first.json ] || : > audit-first.json
            {
              echo "The previous run of this audit was interrupted mid-way by an API failure."
              echo "Its progress log, if one exists at audit-progress.md, records the questions already settled — continue from the first question it doesn't cover, per the instructions below."
              echo ""
              cat audit-prompt.md
            } > audit-resume-prompt.md
            fb_model="${{ inputs.audit-fallback-model }}"
            rc=0
            run_attempt "${{ steps.runners.outputs.fallback-runner }}" "${fb_model:-${{ inputs.audit-model }}}" \
              "$(key_of "$FALLBACK_KEY")" audit-resume-prompt.md audit.json || rc=$?
          fi
          exit "$rc"
      - name: Act on the verdict
        if: ${{ always() && steps.runners.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ ! -s audit.json ]; then
            echo "::error::the audit produced no output" >&2
            exit 1
          fi

          # Usage report first, and fail-soft throughout: a missing field, an
          # unpriced model, or a missing rates install all print n/a and can
          # never block the verdict. Cost is priced uniformly for every
          # provider from rates' own bundled snapshot (offline, no extra
          # network call) rather than a CLI's self-reported estimate, which
          # only some runners provide and which isn't comparable across them.
          usage_row() {
            # jq on an empty file exits 0 with no output; that's still n/a.
            v="$(jq -r "$2 // \"n/a\"" "$1" 2>/dev/null || true)"
            echo "${v:-n/a}"
          }
          rates_cost() {  # $1 json-file $2 provider $3 model
            python3 -c '
          import json, pathlib, sys, io, contextlib

          def cost(path, provider, model):
              try:
                  import rates.ai as ai
              except ImportError:
                  return "n/a"
              if not provider or not model:
                  return "n/a"
              try:
                  raw = json.loads(pathlib.Path(path).read_text())
              except (OSError, ValueError):
                  return "n/a"
              usage = (raw or {}).get("usage") or {}
              if not usage:
                  return "n/a"
              try:
                  matches = ai.load().filter(provider=provider, model=model).models
              except Exception:
                  return "n/a"
              if not matches:
                  return "n/a"
              price = matches[0].price
              total_in = usage.get("input_tokens") or 0
              cache_r = usage.get("cache_read_input_tokens") or 0
              cache_w = usage.get("cache_creation_input_tokens") or 0
              out = usage.get("output_tokens") or 0
              fresh_in = max(total_in - cache_r, 0)
              total = 0.0
              for tokens, unit in ((fresh_in, "input_mtok"), (cache_r, "cache_read_mtok"),
                                   (cache_w, "cache_write_mtok"), (out, "output_mtok")):
                  if tokens <= 0:
                      continue
                  rate = price.get(unit)
                  if rate is None:
                      return "n/a"
                  total += tokens * rate / 1_000_000
              return f"{total:.4f}"

          # rates 1.0.0 prints a trace object to stdout on load; capture it into
          # a throwaway buffer so only the cost reaches stdout, which this
          # function returns via command substitution.
          with contextlib.redirect_stdout(io.StringIO()):
              _result = cost(*sys.argv[1:4])
          print(_result)
          ' "$1" "$2" "$3" 2>/dev/null || echo "n/a"
          }
          # The fallback model mirrors run_attempt's own default: an unset
          # audit-fallback-model reuses audit-model, same-provider only.
          fb_model="${{ inputs.audit-fallback-model }}"
          fb_model="${fb_model:-${{ inputs.audit-model }}}"
          table_row() {  # $1 json-file $2 label $3 provider $4 model
            echo "| $2 | $(usage_row "$1" '.usage.input_tokens') | $(usage_row "$1" '.usage.output_tokens') | $(usage_row "$1" '.usage.cache_read_input_tokens') | $(usage_row "$1" '.usage.cache_creation_input_tokens') | $(rates_cost "$1" "$3" "$4") |"
          }
          {
            echo "### Semantic audit usage"
            echo ""
            echo "| Attempt | Input | Output | Cache read | Cache write | Cost (USD, via rates) |"
            echo "|---|---|---|---|---|---|"
            if [ -e audit-first.json ]; then
              table_row audit-first.json "1 (interrupted, ${{ steps.runners.outputs.primary-provider }})" "${{ steps.runners.outputs.primary-provider }}" "${{ inputs.audit-model }}"
              table_row audit.json "2 (continued, ${{ steps.runners.outputs.fallback-provider }})" "${{ steps.runners.outputs.fallback-provider }}" "$fb_model"
            else
              table_row audit.json "1 (${{ steps.runners.outputs.primary-provider }})" "${{ steps.runners.outputs.primary-provider }}" "${{ inputs.audit-model }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          in_tok="$(usage_row audit.json '.usage.input_tokens')"
          out_tok="$(usage_row audit.json '.usage.output_tokens')"
          cache_r="$(usage_row audit.json '.usage.cache_read_input_tokens')"
          cache_w="$(usage_row audit.json '.usage.cache_creation_input_tokens')"
          if [ -e audit-first.json ]; then
            cost="$(rates_cost audit.json "${{ steps.runners.outputs.fallback-provider }}" "$fb_model")"
          else
            cost="$(rates_cost audit.json "${{ steps.runners.outputs.primary-provider }}" "${{ inputs.audit-model }}")"
          fi
          usage_line="Audit usage: $in_tok in / $out_tok out (cache: $cache_r read, $cache_w written); cost: $cost USD."
          if [ -e audit-first.json ]; then
            usage_line="$usage_line Continued on the fallback provider after an interrupted first attempt; both attempts are in the job summary."
          fi

          jq -r '.result // empty' audit.json > audit-output.txt 2>/dev/null || true
          if [ ! -s audit-output.txt ]; then
            echo "::error::the audit result carried no text" >&2
            exit 1
          fi
          # The verdict contract: the audit's final non-blank line is exactly
          # "AUDIT: PASS" or "AUDIT: FAIL". Match the whole line (trailing
          # whitespace tolerated, nothing else), so "AUDIT: PASSING", a verdict
          # with trailing text, or a verdict that isn't the last line all fail
          # closed rather than passing on a loose substring.
          verdict="$(grep -v '^[[:space:]]*$' audit-output.txt | tail -1 | sed 's/[[:space:]]*$//')"
          if [ "$verdict" = "AUDIT: FAIL" ]; then
            printf '\n\n---\n%s\n' "$usage_line" >> audit-output.txt
            gh issue create \
              --title "Shiplock audit failed on ${GITHUB_SHA::7}" \
              --body-file audit-output.txt
            echo "::error::semantic audit failed; opened an issue" >&2
            exit 1
          elif [ "$verdict" = "AUDIT: PASS" ]; then
            echo "semantic audit passed — $usage_line"
          else
            # Anything but an exact final verdict line is not a pass. Fail closed.
            echo "::error::no valid AUDIT verdict line found in the audit output" >&2
            exit 1
          fi

      - name: Upload audit debug artifacts on failure
        # No live run's raw output is kept anywhere else, so a run that fails
        # in a way the fail-soft usage code doesn't anticipate is otherwise
        # undiagnosable without paying for a repeat run. These files carry the
        # prompt, each attempt's raw event stream and final message, and the
        # built envelope — no key material passes through any of them.
        if: ${{ failure() && steps.runners.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: audit-debug-${{ github.run_id }}
          path: |
            audit-prompt.md
            audit-resume-prompt.md
            audit.json
            audit.json.events
            audit.json.txt
            audit.json.raw
            audit-first.json
            audit-first.json.events
            audit-first.json.txt
            audit-first.json.raw
            audit-output.txt
          if-no-files-found: ignore
          retention-days: 7
